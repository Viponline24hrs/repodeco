<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Generador AES para Landing</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        body { font-family: monospace; padding: 20px; background: #f4f4f4; }
        textarea { width: 100%; height: 80px; margin-top: 10px; font-size: 16px; }
    </style>
</head>
<body>
    <h2>Generador de Payload Compatible (CryptoJS)</h2>
    <script>
        // 1. URL de Oferta intacta
        const urlCPA = "https://health-clevelandclinic-org.translate.goog/5-2-diet?_x_tr_sl=en&_x_tr_tl=es&_x_tr_hl=es&_x_tr_pto=tc&_x_tr_hist=true";
        
        // 2. Tu frase de contraseña
        const claveSecreta = "c3f50be2-a749-42b8-a26f-7441f63f942c";
        
        // 3. Proceso de encriptación
        const payload = CryptoJS.AES.encrypt(urlCPA, claveSecreta).toString();
        
        document.write("<strong>Copia este código y pégalo en el 'data-payload' de tu botón:</strong>");
        document.write("<textarea readonly onclick='this.select()'>" + payload + "</textarea>");
    </script>
</body>
</html>
